category: Backend
type: server
description: .NET 10 Web API Mono-Tenant (Clean Architecture, JWT, EF Core)
tech_stack:
  backend: "Dotnet 10 (C# 13)"
  database: "PostgreSQL"
structure:
  - src/backend/Domain/Common/
  - src/backend/Domain/Entities/
  - src/backend/Infrastructure/Data/
