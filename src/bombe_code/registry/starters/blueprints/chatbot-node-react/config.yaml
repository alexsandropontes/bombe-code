name: "chatbot-node-react"
description: "Chatbot POC com Node.js + React e integração OpenAI/Gemini"
tech_stack:
  backend: "Node.js 20 LTS"
  frontend: "React 19 + Vite"
  llm: "OpenAI API Compatible + Gemini"

structure:
  - "backend/src"
  - "backend/agents/teams"
  - "frontend/src"

env_vars:
  - "OPENAI_API_KEY"
  - "GEMINI_API_KEY"
  - "OPENAI_BASE_URL"
