[project]
name = "bombe-code"
version = "0.3.0"
description = "Bombe Code — agente de código com harness vibe (reimplementação Python do opencode)"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4",
    "httpx>=0.27",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "textual>=0.70",
    "typer>=0.12",
    "pydantic-ai>=0.0.18",
    "pyyaml>=6.0",
    "pyperclip>=1.8.2",
    "reflex>=0.6",
]

[project.optional-dependencies]
desktop = ["pywebview"]

[project.scripts]
bombe-code = "bombe_code.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "ruff", "coverage>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bombe_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes ponta-a-ponta com storage/HTTP REAL, sem mocks (equivalente a DB real)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "docs",
    "docs/**",
    "src/bombe_code/registry/**",
]
